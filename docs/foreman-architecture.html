<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>foreman architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f5f5f5; }
  svg { display: block; width: 1920px; height: 1080px; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; }
  .sans  { font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif; }
  .mono  { font-family: 'Geist Mono', Menlo, monospace; }
  .name  { font-size: 20px; font-weight: 600; fill: #2d3142; }
  .body  { font-size: 16px; fill: #4f5d75; }
  .cmd   { font-size: 12px; fill: #4f5d75; }
  .tag   { font-size: 12px; font-weight: 500; letter-spacing: 0.14em; fill: #7a8399; }
  .lbl   { font-size: 12px; letter-spacing: 0.06em; fill: #4f5d75; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="foreman-architecture-title foreman-architecture-desc">
  <title id="foreman-architecture-title">foreman architecture</title>
  <desc id="foreman-architecture-desc">You describe work to a brainer that cannot write to your repository; it writes a brief, hw dispatches it to a Claude Code or pi executor in its own worktree, the executor reports back through done-invoker and ask-invoker, opt-in review pieces and hw done close the task, engram keeps the memory, setup/heavy queues heavy runs, and merged work leaves through the train while foreman itself ships as a tagged release.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#f5f5f5"/>

  <!-- header -->
  <text x="48" y="64" class="mono tag">FOREMAN · ARCHITECTURE</text>
  <text x="48" y="116" class="serif" font-size="40" fill="#2d3142">A planner that cannot write, builders that cannot collide</text>
  <text x="48" y="156" class="sans body">You talk to the brainer. It dispatches briefs with hw; each executor works in a worktree of its own and its report comes back by itself.</text>
  <text x="1872" y="64" class="mono tag" text-anchor="end">AGENTS · CLAUDE CODE AND PI</text>

  <!-- zones -->
  <rect x="992" y="232" width="432" height="424" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
  <text x="1016" y="258" class="mono tag">EXECUTORS · ONE PER TASK, DISPOSABLE</text>
  <rect x="1504" y="232" width="368" height="424" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
  <text x="1528" y="258" class="mono tag">CLOSE · REVIEW AND GATES</text>

  <!-- connectors (before nodes) -->
  <line x1="176" y1="332" x2="224" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="424" y1="416" x2="424" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="544" y1="532" x2="624" y2="532" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="912" y1="532" x2="992" y2="532" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1424" y1="444" x2="1504" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- return channel -->
  <line x1="992" y1="296" x2="544" y2="296" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <!-- correction / next task -->
  <line x1="544" y1="376" x2="992" y2="376" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <!-- memory -->
  <line x1="256" y1="416" x2="256" y2="768" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 1072 656 L 1072 704 Q 1072 712 1064 712 L 808 712 Q 800 712 800 720 L 800 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- merge -->
  <line x1="1688" y1="656" x2="1688" y2="768" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <rect x="640" y="268" width="256" height="16" rx="2" fill="#f5f5f5"/>
  <text x="768" y="280" class="mono lbl" text-anchor="middle" fill="#eb6c36" style="fill:#c2501f">DONE-INVOKER · ASK-INVOKER</text>
  <rect x="672" y="348" width="192" height="16" rx="2" fill="#f5f5f5"/>
  <text x="768" y="360" class="mono lbl" text-anchor="middle">HW RULING · HW NEXT</text>
  <rect x="548" y="504" width="72" height="16" rx="2" fill="#f5f5f5"/>
  <text x="584" y="516" class="mono lbl" text-anchor="middle">DISPATCH</text>
  <rect x="924" y="504" width="56" height="16" rx="2" fill="#f5f5f5"/>
  <text x="952" y="516" class="mono lbl" text-anchor="middle">LAUNCH</text>
  <rect x="1440" y="416" width="48" height="16" rx="2" fill="#f5f5f5"/>
  <text x="1464" y="428" class="mono lbl" text-anchor="middle">CLOSE</text>
  <rect x="436" y="440" width="56" height="16" rx="2" fill="#f5f5f5"/>
  <text x="464" y="452" class="mono lbl" text-anchor="middle">WRITES</text>
  <rect x="268" y="664" width="64" height="16" rx="2" fill="#f5f5f5"/>
  <text x="300" y="676" class="mono lbl" text-anchor="middle">MEMORY</text>
  <rect x="896" y="684" width="80" height="16" rx="2" fill="#f5f5f5"/>
  <text x="936" y="696" class="mono lbl" text-anchor="middle">FINDINGS</text>
  <rect x="1700" y="704" width="124" height="16" rx="2" fill="#f5f5f5"/>
  <text x="1762" y="716" class="mono lbl" text-anchor="middle">MERGE IS YOURS</text>

  <!-- You -->
  <rect x="48" y="296" width="128" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="296" width="128" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="112" y="328" class="sans name" text-anchor="middle">You</text>
  <text x="112" y="352" class="sans" font-size="12" fill="#4f5d75" text-anchor="middle">one line of work</text>

  <!-- Brainer (focal) -->
  <rect x="224" y="248" width="320" height="168" rx="6" fill="#f5f5f5"/>
  <rect x="224" y="248" width="320" height="168" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="240" y="276" class="mono tag" style="fill:#c2501f">PLANNER</text>
  <text x="240" y="308" class="sans name">Brainer</text>
  <text x="240" y="336" class="sans body">A long-lived Claude Code session,</text>
  <text x="240" y="360" class="sans body">opened with brain &lt;lane&gt;: reads the</text>
  <text x="240" y="384" class="sans body">code, plans, writes briefs. A guard</text>
  <text x="240" y="404" class="sans body">refuses its writes to your repository.</text>

  <!-- Brief -->
  <rect x="288" y="480" width="256" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="288" y="480" width="256" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="304" y="516" class="sans name">Brief</text>
  <text x="304" y="540" class="mono cmd">&lt;lane&gt;/briefs/&lt;task&gt;.md</text>
  <text x="304" y="564" class="sans body">goal, limits, verification</text>

  <!-- hw -->
  <rect x="624" y="424" width="288" height="216" rx="6" fill="#f5f5f5"/>
  <rect x="624" y="424" width="288" height="216" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="640" y="460" class="mono name">hw</text>
  <text x="896" y="460" class="mono tag" text-anchor="end">DISPATCHER</text>
  <text x="640" y="496" class="sans body">checks the brief's front matter</text>
  <text x="640" y="520" class="sans body">worktree and branch per task</text>
  <text x="640" y="544" class="sans body">a herdr tab, the agent started</text>
  <text x="640" y="568" class="sans body">proves the brief arrived</text>
  <text x="640" y="592" class="sans body">secrets: Bitwarden items, read</text>
  <text x="640" y="616" class="sans body">only through hw secret run</text>

  <!-- Executors -->
  <rect x="1016" y="272" width="384" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="1016" y="272" width="384" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1032" y="308" class="sans name">Executor · Claude Code</text>
  <text x="1032" y="332" class="mono cmd">worktree + branch task/&lt;task&gt;</text>
  <text x="1032" y="356" class="sans body">own tab; own database where provisioned</text>

  <rect x="1016" y="392" width="384" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="1016" y="392" width="384" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1032" y="428" class="sans name">Executor · pi</text>
  <text x="1032" y="452" class="mono cmd">worktree + branch task/&lt;task&gt;</text>
  <text x="1032" y="476" class="sans body">same contract: one brief, one report</text>

  <rect x="1016" y="512" width="384" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="1016" y="512" width="384" height="120" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="1032" y="548" class="sans name">In every executor</text>
  <text x="1032" y="576" class="sans body">a cheap-explorer subagent for searches</text>
  <text x="1032" y="600" class="sans body">write guards; opt-in --sandbox on macOS</text>
  <text x="1032" y="620" class="mono cmd">plugins: [webguide, …] loaded per brief</text>

  <!-- Close -->
  <rect x="1528" y="272" width="320" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="1528" y="272" width="320" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1544" y="308" class="sans name">Review pieces, opt-in</text>
  <text x="1544" y="336" class="mono cmd">review: [judgment-day, thermo,</text>
  <text x="1544" y="356" class="mono cmd">         ponytail, pstack, tests]</text>

  <rect x="1528" y="392" width="320" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="1528" y="392" width="320" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1544" y="428" class="mono name">hw done</text>
  <text x="1544" y="456" class="sans body">runs the brief's Verification,</text>
  <text x="1544" y="480" class="sans body">records its exit code, closes the tab</text>

  <rect x="1528" y="512" width="320" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="1528" y="512" width="320" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1544" y="548" class="mono name">setup/heavy</text>
  <text x="1544" y="576" class="sans body">suites and builds wait for a slot;</text>
  <text x="1544" y="600" class="sans body">a short lane for runs of seconds</text>

  <!-- engram -->
  <rect x="224" y="768" width="688" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="224" y="768" width="688" height="120" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="240" y="808" class="sans name">engram</text>
  <text x="896" y="808" class="mono tag" text-anchor="end">MEMORY</text>
  <text x="240" y="836" class="sans body">The brainer's memory across sessions, and where an executor saves</text>
  <text x="240" y="860" class="sans body">its findings: the report it sends is a pointer to them.</text>

  <!-- merge and release -->
  <rect x="992" y="768" width="880" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="992" y="768" width="880" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1008" y="808" class="sans name">Merge and release</text>
  <text x="1856" y="808" class="mono tag" text-anchor="end">THE WAY OUT</text>
  <text x="1008" y="836" class="mono cmd">hw train add → train-&lt;lane&gt; → hw train push: full suite → base branch → hw reap: worktree, branch, database removed</text>
  <text x="1008" y="864" class="sans body">foreman itself ships as a tagged release: Homebrew or install.sh, then foreman-setup upgrade.</text>

  <!-- herdr -->
  <rect x="48" y="912" width="1824" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="912" width="1824" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="72" y="952" class="sans name">herdr</text>
  <text x="160" y="950" class="sans body">The desktop app or terminal panes every session runs in: one tab per executor, a cockpit card for each, and the one that needs you named first.</text>

  <!-- legend -->
  <line x1="48" y1="1000" x2="1872" y2="1000" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="48" y="1036" class="mono tag">LEGEND</text>
  <rect x="160" y="1024" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="196" y="1036" class="sans" font-size="12" fill="#4f5d75">planner, guarded</text>
  <rect x="336" y="1024" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="372" y="1036" class="sans" font-size="12" fill="#4f5d75">command or session</text>
  <rect x="528" y="1024" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="564" y="1036" class="sans" font-size="12" fill="#4f5d75">store</text>
  <rect x="640" y="1024" width="24" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="676" y="1036" class="sans" font-size="12" fill="#4f5d75">inside each executor</text>
  <line x1="840" y1="1032" x2="888" y2="1032" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="900" y="1036" class="sans" font-size="12" fill="#4f5d75">return channel: a report or a question</text>
  <line x1="1152" y1="1032" x2="1200" y2="1032" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1212" y="1036" class="sans" font-size="12" fill="#4f5d75">a correction or the next task</text>
  <line x1="1416" y1="1032" x2="1464" y2="1032" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="1476" y="1036" class="sans" font-size="12" fill="#4f5d75">flow</text>
</svg>
</body>
</html>
