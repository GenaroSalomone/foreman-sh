# THE FLOORS: the oldest version of each outside tool this harness runs against.
# One place. install.sh --check, `hw preflight`, `brain` (the cockpit) and `hw gentle-home`
# read it through lib/hw/deps.sh; no script keeps a number of its own.
#
# One row per tool, fields separated by '|' (a field cannot contain one):
#   name      the tool; also the name of the version cache entry
#   min       the floor, dotted numbers; with match=exact, the ONLY version accepted
#   match     min    = this version or newer
#             exact  = this version and no other (gentle-ai: its release checksums are pinned)
#   command   how the tool prints its version; the first word is looked up on PATH
#   needs     when a dispatch needs it:  always | vendor:<claude|opencode> | sdd:gentle
#   basis     where the number comes from (the reader decides whether it is a measurement):
#               code      a script already demanded it: the number moved here unchanged
#               machine   no script named one: the version installed when this manifest was
#                         written (2026-10-08) is the floor. A guess at what the harness needs,
#                         not a measurement of where it breaks.
#   update    what to run (or open) to get a version at or above the floor
#
# A tool that is not installed is not a floor violation: its absence is reported
# where that tool is needed (the vendor of the lane, the sdd mode), as before.
herdr|0.9.1|min|herdr --version|always|machine|herdr update
claude|2.1.289|min|claude --version|vendor:claude|code|claude update
opencode|1.18.31|min|opencode --version|vendor:opencode|code|npm install -g opencode-ai@latest
node|22.7|min|node --version|vendor:opencode|code|https://nodejs.org/en/download
gentle-ai|4.0.0|exact|gentle-ai version|sdd:gentle|code|hw gentle-home
engram|3.0.0|min|engram --version|always|machine|brew upgrade gentleman-programming/tap/engram
jq|1.7|min|jq --version|always|code|https://jqlang.github.io/jq/download/
